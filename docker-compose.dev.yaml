version: '3.8'

services:
  carbon:
    build:
      context: .
      network: host
    container_name: carbon-dev
    volumes:
      - .:/app
      - carbon-data:/app/data
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=settings.dev
      - GUNICORN_EXTRA_ARGS=--reload

volumes:
  carbon-data:
